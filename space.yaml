spec: 1
name: space-ops
title: Space Ops
description: Monitor services, tasks and data with reusable checks, incident evidence and peer visibility.
icon: icon.png
url: /?lang={lang}&accent={accent}
status: active
repo: https://github.com/ericz-lab/space-ops.git
i18n:
  zh:
    title: 运维中心
    description: 通用巡检、数据断言与故障追踪，统一查看本机及 peer 的运行状态。
    agents:
      operator:
        title: 运维助手
        description: 查看系统状态、巡检和故障证据，排查本机及 peer 的运行问题。
      engineer:
        title: 平台工程师
        description: 维护 ai-space 本身：升级、备份与恢复、路由和 peer，并评审平台变更。
service:
  command: bun src/index.ts
  port: 8998
  health: /healthz
  env:
    # Command that prints an app's recent log for a diagnosis: {app} = app name, {lines} = line count.
    # Machine-specific, so it comes from the workspace .env; empty = logs are reported as not checked.
    OPS_LOGS_COMMAND: ${OPS_LOGS_COMMAND:-}
storage:
  database: sqlite
skills:
  - path: skills/space-ops
agents:
  - name: operator
    title: Space Ops Assistant
    description: Inspect system status, daily checks and incident evidence, and troubleshoot local and peer failures.
    prompt: agents/operator.md
    tools: [Read, Glob, Grep, "Bash(bun src/inspect.ts *)"]
    skills: [./skills/space-ops]
  # The Platform Engineer holds the write tools the operator deliberately lacks: the space CLI
  # (upgrades, backups and restores, router, peers, services) and bun for the platform checkout.
  - name: engineer
    title: Platform Engineer
    description: Maintains ai-space itself - upgrades, backups and restores, the router and peers - and reviews platform changes before they reach production.
    prompt: agents/engineer.md
    tools: [Read, Glob, Grep, "Bash(bun src/inspect.ts *)", "Bash(space *)", "Bash(bun *)"]
    skills: [./skills/space-ops]
# The one-click diagnosis (tag `diagnose`) defaults to Codex's advanced tier; the panel may override it.
model:
  tags:
    diagnose: codex/advanced
widgets:
  - name: status
    title: Space Ops · Status
    kind: items
    source: /api/widget
    link: /
    size: 2x1
    refresh: 60s

# `space app deploy` (the post-receive hook) runs these after checkout, after bun install
# --frozen-lockfile; a failure keeps the running service (ai-space docs/app-spec.md#deploy).
deploy:
  check: [bun run typecheck, bun test]
