<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3f3">
<title>Space Ops</title>
<link rel="icon" href="/icon.svg">
<!-- theme and language before first paint: the stored overrides (Settings, the sidebar), else the browser's -->
<script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search),get=function(k){try{return localStorage.getItem(k)}catch(e){return null}};var t=q.get("theme");if(t!=="light"&&t!=="dark")t=get("ops-theme");if(t==="light"||t==="dark")d.dataset.theme=t;d.dataset.mode=t==="light"||t==="dark"?t:"system";var dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",dark?"#121212":"#f3f3f3");var l=q.get("lang");if(!/^(zh|en)/i.test(l||""))l=get("ops-language")||(/^zh/i.test(navigator.language)?"zh":"en");d.lang=/^zh/i.test(l)?"zh-CN":"en";})()</script>
<script>/* The panel's accent (ai-space docs/ui-kit.md#accent): ?accent=<light>.<dark>, kept under space.accent; an unlayered style wins over the kit's layers. */(function(){var re=/^[0-9a-f]{6}\.[0-9a-f]{6}$/i,a=new URLSearchParams(location.search).get("accent");if(a&&re.test(a)){try{localStorage.setItem("space.accent",a)}catch(e){}}else{try{a=localStorage.getItem("space.accent")}catch(e){a=null}}if(!a||!re.test(a))return;var c=a.split("."),s=document.createElement("style");s.textContent=':root{--accent:#'+c[0]+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#'+c[1]+'}}:root[data-theme="dark"]{--accent:#'+c[1]+'}';document.head.appendChild(s)})()</script>
<!-- Space Tiles (ai-space docs/ui-kit.md): this app's copy of the kit, then the space's current /_space/ui.css, then this app's rules.
     Bun's HTML bundler moves and merges the stylesheets, so cascade layers set the order: style.css imports the copy into layer kit
     and keeps its own rules in layer app; the space's version goes into layer space, added here at runtime so the bundler leaves the
     path alone (a 404 on an older ai-space or on the app's own port is ignored). -->
<script>(function(){var s=document.createElement("style");s.textContent='@layer kit, space, app;@import url("/_space/ui.css") layer(space);';document.head.appendChild(s)})()</script>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.ts"></script>
</head>
<body>
<div id="app"><div class="boot">Space Ops</div></div>
<div class="sp-scrim" data-drawer-close></div>
<div id="overlay"></div>
<div id="toast" class="sp-toast" role="status" aria-live="polite"></div>
<script>(function(){var s=document.createElement("script");s.src="/_space/usage.js";s.defer=true;document.head.appendChild(s)})()</script>
<script>(function(){var s=document.createElement("script");s.src="/_space/feedback.js";s.defer=true;document.head.appendChild(s)})()</script>
</body>
</html>
